# Not managed by Upptime: replaces "Update Template CI" (update-template.yml),
# which pushes regenerated workflows straight to the default branch.
# Disable "Update Template CI" in the Actions tab so only this one runs.
name: Update Template PR
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-upptime
  cancel-in-progress: false
jobs:
  update-template:
    runs-on: ubuntu-latest
    env:
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
    steps:
      - name: Create GitHub App token
        id: app_token
        if: ${{ vars.GH_APP_ID != '' && env.GH_APP_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ env.GH_APP_PRIVATE_KEY }}
      - name: Clear GitHub App private key
        if: ${{ always() }}
        shell: bash
        run: echo "GH_APP_PRIVATE_KEY=" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app_token.outputs.token || secrets.GH_PAT || github.token }}
      # update-template always runs `git push` itself; send that push to a throwaway repo.
      - name: Redirect upptime's push
        run: |
          git init -q --bare "$RUNNER_TEMP/sink.git"
          git remote set-url --push origin "$RUNNER_TEMP/sink.git"
      - name: Update template
        uses: upptime/uptime-monitor@master
        with:
          command: "update-template"
        env:
          GH_PAT: ${{ steps.app_token.outputs.token || secrets.GH_PAT || github.token }}
      # The fake push also moved origin/<branch>; fetch to reset it to the real remote.
      - name: Restore push URL
        run: |
          git config --unset remote.origin.pushurl
          git fetch -q origin
      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app_token.outputs.token || secrets.GH_PAT }}
          branch: upptime/update-template
          delete-branch: true
          title: "Update Upptime template"
          body: "Generated by `update-template`. Review the workflow diff before merging."
