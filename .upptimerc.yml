# Change these first
owner: MIERUNE # Your GitHub organization or username, where this repository lives
repo: kumoy-upptime # The name of this repository

sites:
  - name: Kumoy Website
    url: https://kumoy.io
  - name: Kumoy App
    url: https://app.kumoy.io
  - name: Kumoy API
    url: https://app.kumoy.io/api/auth/ok
  - name: Kumoy Public Map
    url: https://app.kumoy.io/public/map/6e81496d-77e2-43d5-b6dd-10bf423392e3
  - name: Kumoy Docs
    url: https://docs.kumoy.io
  - name: Kumoy Map Tiles
    url: https://maptiles.kumoy.io/latest/streets/raster/512/0/0/0
    headers:
      - "Referer: https://app.kumoy.io/"

status-website:
  # Add your custom domain name, or remove the `cname` line if you don't have a domain
  # Uncomment the `baseUrl` line if you don't have a custom domain and add your repo name there
  # cname: demo.upptime.js.org
  publish: true
  baseUrl: /kumoy-upptime
  logoUrl: https://raw.githubusercontent.com/MIERUNE/logo/refs/heads/main/svg/MIERUNE_logo01.svg
  name: Upptime
  introTitle: "**Upptime** is the open-source uptime monitor and status page, powered entirely by GitHub."
  introMessage: This is a sample status page which uses **real-time** data from our [GitHub repository](https://github.com/upptime/upptime). No server required — just GitHub Actions, Issues, and Pages. [**Get your own for free**](https://github.com/upptime/upptime)
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO

# Upptime also supports notifications, assigning issues, and more
# See https://upptime.js.org/docs/configuration
